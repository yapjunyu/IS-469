[project]
name = "study-tutor"
version = "0.1.0"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests", "agent/tests"]

[tool.ruff]
target-version = "py310"  # matches requires-python, so syntax newer than 3.10 fails the check
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]  # pinned, so a ruff upgrade cannot widen the gate on its own
